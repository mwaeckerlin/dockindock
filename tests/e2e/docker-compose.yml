# E2E stack: the shipped image started privileged (rootless docker needs the
# unshare/namespace privileges), then exercised from outside via exec.
# Deliberately no host prerequisites: the suite proves the image runs on a
# stock host (no AppArmor profile, no sysctl change).
name: dockindock-e2e

services:
  dockindock:
    image: mwaeckerlin/dockindock
    build:
      context: ../..
    privileged: true
    # a volume on the data root is required: without it the inner overlay
    # mounts would sit on the container's own overlayfs (overlay-on-overlay
    # is rejected by the kernel)
    volumes:
      - dockindock-data:/docker-data

  # same image as a network dind service: API published over plain TCP into
  # the isolated test network, storage on a named volume
  dind-tcp:
    image: mwaeckerlin/dockindock
    privileged: true
    environment:
      DOCKER_TCP_PORT: "2375"
    volumes:
      - dind-tcp-data:/docker-data

  # same image with additional daemon options given as the command: the
  # inner daemon pulls through the pull-through cache below
  dind-mirror:
    image: mwaeckerlin/dockindock
    privileged: true
    command:
      - "--registry-mirror=http://mirror:5000"
      - "--insecure-registry=mirror:5000"
    volumes:
      - dind-mirror-data:/docker-data
    depends_on:
      - mirror

  # pull-through cache of Docker Hub, the counterpart a registry mirror
  # points at; its request log proves which pulls went through it
  mirror:
    image: registry:2
    environment:
      REGISTRY_PROXY_REMOTEURL: "https://registry-1.docker.io"

volumes:
  dockindock-data:
  dind-tcp-data:
  dind-mirror-data:
